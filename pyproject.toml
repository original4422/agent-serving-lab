[project]
name = "agent-serving-lab"
version = "0.1.0"
description = "Reproducible client-admission scheduling experiments for agent workloads"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29"]

[project.scripts]
agent-serving-lab = "serving_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serving_lab"]
